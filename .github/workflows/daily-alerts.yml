# Weekday phone alerts after the US close (see sharkfin/alerts.py and docs/ALERTS_SETUP.md).
# Repository secrets used (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_KEY  - per-user alerts (same values as the app's [supabase] secrets)
#   NTFY_TOPIC                  - optional: your own topic for the day's buy signals
name: Daily alerts

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC = 4:30 pm New York in winter, 5:30 pm in summer
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the alerts instead of sending them"
        type: boolean
        default: false

concurrency:
  group: daily-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m sharkfin.alerts ${{ inputs.dry_run && '--dry-run' || '' }}
